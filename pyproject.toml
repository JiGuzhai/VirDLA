[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "virdla"
version = "0.1.0"
description = "A virtual dual-luciferase assay interface for genomic model backends"
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-3.0-or-later"
authors = [{name = "LinXiao Nie", email = "linxiaonie@apromoter.bio"}]
keywords = ["VirDLA", "virtual dual-luciferase assay", "genomics", "foundation-models", "promoter-design"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

[project.urls]
Homepage = "https://apromoter.bio"
Documentation = "https://apromoter.bio"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
